name: start

on:
  workflow_dispatch:
    inputs:
      immediate:
        description: 'Uruchom natychmiast bez oczekiwania na wylosowaną godzinę'
        type: boolean
        default: true
      force:
        description: 'Wymuś uruchomienie nawet w weekend lub święto'
        type: boolean
        default: false
      dry_run:
        description: 'Tryb testowy (bez klikania w Cypress i bez zapisu stanu)'
        type: boolean
        default: false
  schedule:
    - cron: '45 3 * * 1-5'

jobs:
  start-work:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      JCN: ${{ secrets.JCN }}
      JPD: ${{ secrets.JPD }}
      IMMEDIATE: ${{ github.event.inputs.immediate || 'false' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run scheduled start
        run: npm run schedule:start

      - name: Commit and push state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/work-state.json
          git diff --staged --quiet || (git commit -m "Update work state: started [skip ci]" && git pull --rebase origin main && git push origin main)